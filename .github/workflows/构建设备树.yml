name: Compile RK3328 DTS to DTB & Upload Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  compile-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Full Dependencies
        run: |
          set -x
          # 换阿里云源，加速依赖安装
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          # 安装dtc构建+DTS编译必需依赖
          sudo apt-get install -y build-essential bison flex python3 python3-pip \
            git curl wget unzip tar libssl-dev liblz4-dev libzstd-dev patchutils \
            device-tree-compiler # 系统dtc备用

      - name: Build DTC from LibreELEC 12.0 Kernel (6.6版本)
        id: build-dtc
        run: |
          set -x
          # 下载LibreELEC 12.0 对应的6.6内核源码（Rockchip适配版本）
          KERNEL_DIR="./linux-libreelec-6.6"
          if [ ! -d "$KERNEL_DIR" ]; then
            echo "📥 下载LibreELEC 12.0 6.6内核源码"
            git clone --depth 1 --branch libreelec-6.6.y https://github.com/LibreELEC/linux.git "$KERNEL_DIR"
            # 应用Rockchip RK3328专属补丁（确保dtc兼容设备树语法）
            curl -sSL https://raw.githubusercontent.com/LibreELEC/LibreELEC.tv/libreelec-12.0/projects/Rockchip/patches/linux/linux-6.6-rockchip.patch | patch -d "$KERNEL_DIR" -p1 || echo "⚠️ 非关键补丁应用失败，继续构建"
          fi

          # 独立构建dtc工具（仅编译dtc，速度快）
          echo "🔨 构建6.6内核dtc工具"
          make -C "$KERNEL_DIR/scripts/dtc" V=1 -j$(nproc)
          DTC_PATH="$KERNEL_DIR/scripts/dtc/dtc"

          # 容错：dtc构建失败则使用系统dtc
          if [ ! -x "$DTC_PATH" ]; then
            echo "⚠️ 内核源码dtc构建失败，切换到系统dtc"
            DTC_PATH=$(which dtc)
            dtc --version
          fi

          echo "dtc_path=$DTC_PATH" >> $GITHUB_ENV
          echo "✅ 最终使用的dtc工具: $DTC_PATH"

      - name: Compile Fixed DTS (RK3328-L1Pro)
        id: compile-dts
        run: |
          set -x
          # 固定根目录下的目标文件
          DTS_FILE="rk3328-l1pro-1296mhz.dts"
          DTSI_FILE="rk3328.dtsi"
          DTB_FILE="${DTS_FILE%.dts}.dtb"

          # 严格校验输入文件（避免路径错误）
          if [ ! -f "$DTS_FILE" ]; then
            echo "❌ 根目录未找到DTS文件: $DTS_FILE"
            ls -lh ./ # 输出根目录文件列表，方便排查
            exit 1
          fi
          if [ ! -f "$DTSI_FILE" ]; then
            echo "❌ 根目录未找到DTSI头文件: $DTSI_FILE"
            ls -lh ./
            exit 1
          fi

          # 编译设备树（指定根目录为包含路径，兼容LibreELEC 6.6内核语法）
          echo "📦 编译设备树: $DTS_FILE → $DTB_FILE"
          ${{ env.dtc_path }} -I dts -O dtb -o "$DTB_FILE" "$DTS_FILE" \
            -i ./ \
            -v \
            -Wno-deprecated \
            -Wno-avoid_unnecessary_addr_size \
            -Wno-graph_child_address

          # 验证编译结果
          if [ ! -f "$DTB_FILE" ]; then
            echo "❌ DTB文件未生成，编译失败"
            exit 1
          fi

          # 输出文件信息，确认有效性
          echo "✅ 编译成功！"
          ls -lh "$DTB_FILE"
          file "$DTB_FILE" # 验证文件类型为Device Tree Blob
          echo "dtb_file=$DTB_FILE" >> $GITHUB_ENV

      - name: Upload DTB to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtb_file }}
          body: |
            ## RK3328-L1Pro 设备树编译产物（LibreELEC 12.0）
            - DTS源码：`rk3328-l1pro-1296mhz.dts`
            - 依赖头文件：`rk3328.dtsi`
            - 编译工具：${{ env.dtc_path == '/usr/bin/dtc' ? '系统dtc' : 'LibreELEC 6.6内核dtc' }}
            - 内核版本：6.6（LibreELEC 12.0 原生适配）
          overwrite: true
