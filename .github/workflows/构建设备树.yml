name: 编译DTS到DTB并上传Release
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release标签（如v1.0.0）'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装dtc（兼容版）
        run: |
          sudo apt-get update && sudo apt-get install -y device-tree-compiler
          dtc --version || { echo "❌ dtc安装失败"; exit 1; }

      - name: 编译设备树（强制错误输出）
        run: |
          DTS="rk3328-l1pro-1296mhz.dts"
          DTB="${DTS%.dts}.dtb"
          
          # 1. 再次确认文件存在
          echo "=== 验证文件 ==="
          ls -lh "$DTS" && ls -lh "rk3328.dtsi"
          echo "✅ 文件验证通过"

          # 2. 核心修复：增加--warn-no-unit_address_vs_reg + 重定向所有输出
          echo "=== 开始编译（输出所有错误/警告） ==="
          # 重定向stdout和stderr到日志，确保不遗漏任何信息
          dtc -I dts -O dtb -o "$DTB" "$DTS" -i ./ \
            -v \
            --strict \
            --warn-no-unit_address_vs_reg 2>&1 | tee dtc-compile.log
          COMPILE_EXIT=$?

          # 3. 强制输出编译日志（关键！）
          echo -e "\n=== DTC编译完整日志 ==="
          cat dtc-compile.log

          # 4. 校验结果
          if [ $COMPILE_EXIT -ne 0 ]; then
            echo "❌ 编译失败！dtc退出码: $COMPILE_EXIT"
            exit 1
          fi
          if [ ! -f "$DTB" ]; then
            echo "❌ 未生成DTB文件！查看上面的编译日志找语法错误"
            exit 1
          fi

          # 5. 确认产物有效
          echo "✅ 编译成功！"
          ls -lh "$DTB"
          file "$DTB"
          echo "dtb_file=$DTB" >> $GITHUB_ENV

      - name: 上传到Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtb_file }}
          body: |
            ## RK3328-L1Pro 设备树编译产物
            - 编译工具：系统dtc 1.7.0
            - DTS源码：rk3328-l1pro-1296mhz.dts
            - 依赖头文件：rk3328.dtsi
          overwrite: true
