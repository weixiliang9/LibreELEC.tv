name: 编译DTS到DTB并上传Release
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release标签（如v1.0.0）'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装dtc并验证版本
        run: |
          sudo apt-get update && sudo apt-get install -y device-tree-compiler
          # 验证dtc安装成功
          dtc --version || { echo "❌ dtc安装失败"; exit 1; }

      - name: 编译设备树（强制校验结果）
        run: |
          DTS="rk3328-l1pro-1296mhz.dts"
          DTB="${DTS%.dts}.dtb"
          
          # 1. 验证DTS/DTSI文件存在（输出详细路径）
          echo "=== 验证文件 ==="
          if [ ! -f "$DTS" ]; then
            echo "❌ 根目录未找到DTS文件: $DTS"
            ls -lh ./  # 输出根目录所有文件，确认文件位置
            exit 1
          fi
          if [ ! -f "rk3328.dtsi" ]; then
            echo "❌ 根目录未找到DTSI文件: rk3328.dtsi"
            ls -lh ./
            exit 1
          fi
          echo "✅ 文件验证通过"

          # 2. 编译（捕获退出码，强制输出错误）
          echo "=== 开始编译 ==="
          dtc -I dts -O dtb -o "$DTB" "$DTS" -i ./ -v
          COMPILE_EXIT=$?
          
          # 3. 校验编译结果
          if [ $COMPILE_EXIT -ne 0 ]; then
            echo "❌ 编译失败！dtc退出码: $COMPILE_EXIT"
            exit 1
          fi
          if [ ! -f "$DTB" ]; then
            echo "❌ 编译未生成DTB文件！"
            exit 1
          fi
          
          # 4. 输出DTB信息，确认生成成功
          echo "✅ 编译成功！"
          ls -lh "$DTB"
          file "$DTB"  # 验证文件类型为Device Tree Blob
          echo "dtb_file=$DTB" >> $GITHUB_ENV

      - name: 上传到Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtb_file }}
          body: |
            ## RK3328-L1Pro 设备树编译产物
            - 编译工具：系统dtc（版本见执行日志）
            - DTS源码：rk3328-l1pro-1296mhz.dts
            - 依赖头文件：rk3328.dtsi
          overwrite: true
