name: Compile RK3328 DTS to DTB & Upload Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  compile-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install All Dependencies
        run: |
          set -x
          sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential bison flex python3 python3-pip \
            git curl wget unzip tar libssl-dev liblz4-dev libzstd-dev patchutils \
            device-tree-compiler gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libglib2.0-dev

      - name: 下载+构建DTC（容错版）
        id: build-dtc
        run: |
          set -x
          DTC_SRC_DIR="./dtc-src"
          if [ ! -d "$DTC_SRC_DIR" ]; then
            echo "📥 下载独立DTC源码"
            git clone --depth 1 https://github.com/dgibson/dtc.git "$DTC_SRC_DIR" || {
              echo "⚠️ GitHub克隆失败，使用系统dtc"
              echo "dtc_path=$(which dtc)" >> $GITHUB_ENV
              echo "dtc_type=系统dtc (DTC 1.7.0)" >> $GITHUB_ENV
              exit 0
            }
          fi

          echo "🔨 构建独立DTC工具"
          cd "$DTC_SRC_DIR"
          make V=1 -j$(nproc) CC=gcc || {
            echo "⚠️ DTC构建失败，切换系统dtc"
            echo "dtc_path=$(which dtc)" >> $GITHUB_ENV
            echo "dtc_type=系统dtc (DTC 1.7.0)" >> $GITHUB_ENV
            exit 0
          }

          DTC_PATH="$DTC_SRC_DIR/dtc"
          if [ -x "$DTC_PATH" ]; then
            echo "dtc_path=$DTC_PATH" >> $GITHUB_ENV
            echo "dtc_type=独立编译DTC（LibreELEC适配）" >> $GITHUB_ENV
            $DTC_PATH --version
          else
            echo "dtc_path=$(which dtc)" >> $GITHUB_ENV
            echo "dtc_type=系统dtc (DTC 1.7.0)" >> $GITHUB_ENV
          fi

      - name: 编译设备树（最终稳定版）
        id: compile-dts
        run: |
          set -x
          # 固定文件路径
          DTS_FILE="rk3328-l1pro-1296mhz.dts"
          DTSI_FILE="rk3328.dtsi"
          DTB_FILE="${DTS_FILE%.dts}.dtb"

          # 校验文件存在性
          if [ ! -f "$DTS_FILE" ]; then
            echo "❌ 根目录未找到DTS文件: $DTS_FILE"
            ls -lh ./
            exit 1
          fi
          if [ ! -f "$DTSI_FILE" ]; then
            echo "❌ 根目录未找到DTSI文件: $DTSI_FILE"
            ls -lh ./
            exit 1
          fi

          # 核心编译命令（移除--debug，避免系统dtc 1.7.0不兼容；保留-v输出详细错误）
          echo "📦 编译设备树：$DTS_FILE → $DTB_FILE"
          echo "使用DTC工具：${{ env.dtc_path }}"
          ${{ env.dtc_path }} -I dts -O dtb -o "$DTB_FILE" "$DTS_FILE" \
            -i ./ \
            -v \
            -Wno-all

          # 捕获编译退出码，输出详细错误
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ DTC编译失败！错误码：$EXIT_CODE"
            echo "=== 可能原因：DTS语法错误、DTSI依赖缺失 ==="
            exit $EXIT_CODE
          fi

          # 验证编译结果
          if [ -f "$DTB_FILE" ]; then
            echo "✅ 编译成功！"
            ls -lh "$DTB_FILE"
            file "$DTB_FILE"
            echo "dtb_file=$DTB_FILE" >> $GITHUB_ENV
          else
            echo "❌ DTB文件未生成，编译失败"
            exit 1
          fi

      - name: 上传DTB到Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtb_file }}
          body: |
            ## RK3328-L1Pro 设备树编译产物（LibreELEC 12.0 兼容）
            - DTS源码：`rk3328-l1pro-1296mhz.dts`
            - 依赖头文件：`rk3328.dtsi`
            - 编译工具：${{ env.dtc_type }}
            - 编译状态：成功（已验证DTB文件有效性）
          overwrite: true
