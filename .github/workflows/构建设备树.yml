name: 编译DTS到DTB并上传Release
on: workflow_dispatch
  inputs:
    release-tag:
      description: 'Release标签（如v1.0.0）'
      required: false
      default: ''

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装dtc
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      - name: 编译设备树
        run: |
          DTS="rk3328-l1pro-1296mhz.dts"
          DTB="${DTS%.dts}.dtb"
          
          # 编译（直接用系统dtc，已验证可用）
          dtc -I dts -O dtb -o "$DTB" "$DTS" -i ./ -v
          echo "dtb_file=$DTB" >> $GITHUB_ENV

      - name: 上传到Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtb_file }}
