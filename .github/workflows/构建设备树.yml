name: 编译DTS到DTB并上传Release（LibreELEC 12.0 兼容）
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release标签（如v1.0.0）'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖+下载LibreELEC 6.6内核dtc源码
        run: |
          # 安装构建依赖
          sudo apt-get update && sudo apt-get install -y git make gcc bison flex
          # 下载LibreELEC 12.0 6.6内核的dtc源码（确保语法兼容）
          git clone --depth 1 --branch linux-6.6.y https://github.com/LibreELEC/linux.git le-linux
          cd le-linux/scripts/dtc
          # 构建dtc（LibreELEC原生版本，兼容RK3328设备树）
          make -j$(nproc)
          echo "dtc_path=$(pwd)/dtc" >> $GITHUB_ENV

      - name: 编译设备树（LibreELEC原生dtc）
        run: |
          DTS="rk3328-l1pro-1296mhz.dts"
          DTB="${DTS%.dts}.dtb"
          
          echo "=== 使用LibreELEC 6.6内核dtc编译 ==="
          ${{ env.dtc_path }} --version
          
          # 核心编译（输出详细日志，LibreELEC dtc会暴露语法问题）
          ${{ env.dtc_path }} -I dts -O dtb -o "$DTB" "$DTS" -i ./ -v --strict
          
          # 强制校验产物
          if [ ! -f "$DTB" ]; then
            echo "❌ 编译失败！输出DTS前50行供排查："
            head -n 50 "$DTS"
            exit 1
          fi
          
          echo "✅ 编译成功！"
          ls -lh "$DTB"
          file "$DTB"
          echo "dtb_file=$DTB" >> $GITHUB_ENV

      - name: 上传到Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.sha }}
          name: RK3328-L1Pro-DTB-${{ github.event.inputs.release-tag || github.sha }}
          files: ${{ env.dtc_file }}
          body: |
            ## RK3328-L1Pro 设备树编译产物（LibreELEC 12.0 原生兼容）
            - 编译工具：LibreELEC 6.6内核dtc
            - DTS源码：rk3328-l1pro-1296mhz.dts
            - 依赖头文件：rk3328.dtsi
          overwrite: true
