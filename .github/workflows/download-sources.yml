name: 手动触发 - 下载LibreELEC源码（缓存到仓库）

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（tag或branch）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 选择构建项目（PROJECT）
        required: true
        options:
          - Generic
          - RPi（树莓派）
          - RK3328
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 选择目标架构（ARCH）
        required: true
        options:
          - x86_64
          - armv7
          - aarch64
        default: aarch64
      # 🔴 新增：Rockchip项目专用 - 选择具体设备型号（解决报错的关键）
      rockchip_device:
        type: choice
        description: Rockchip项目专用 - 选择具体设备（非Rockchip项目可忽略）
        required: true
        options:
          - RK3288
          - RK3328  # 你的目标设备，默认选中
          - RK3399
        default: RK3328

jobs:
  download-sources:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取LibreELEC仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖包
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip

      - name: 切换分支/版本
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}

      # 🔴 关键修改：执行download-tool时，额外添加设备参数 DEVICE=${{ ... }}
      - name: 下载源码包（含工具链源码）
        run: |
          # 核心：Rockchip项目必须指定DEVICE，其他项目（如Generic）可忽略DEVICE参数
          PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool

      - name: 打包源码包
        run: |
          zip -r librelec-sources-${{ github.event.inputs.librelec_version }}-${{ github.event.inputs.project }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.rockchip_device }}.zip sources/

      - name: 上传源码包到Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sources-${{ github.event.inputs.librelec_version }}-${{ github.event.inputs.project }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.rockchip_device }}
          name: 源码包-${{ github.event.inputs.librelec_version }}-${{ github.event.inputs.project }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.rockchip_device }}
          files: librelec-sources-*.zip
          body: 自动下载的LibreELEC源码包（含工具链源码），版本：${{ github.event.inputs.librelec_version }}，PROJECT：${{ github.event.inputs.project }}，ARCH：${{ github.event.inputs.arch }}，Rockchip设备：${{ github.event.inputs.rockchip_device }}
