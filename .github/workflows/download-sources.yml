name: 手动触发 - 下载LibreELEC源码（缓存供编译）

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（tag或branch）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 选择构建项目（PROJECT）
        required: true
        options:
          - Generic
          - RPi（树莓派）
          - RK3328
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 选择目标架构（ARCH）
        required: true
        options:
          - x86_64
          - armv7
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: Rockchip项目专用 - 选择具体设备（非Rockchip项目可忽略）
        required: true
        options:
          - RK3288
          - RK3328
          - RK3399
        default: RK3328

jobs:
  download-sources:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取LibreELEC仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖包
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip

      - name: 切换分支/版本
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}

      # 🔴 关键1：下载源码包（已修复DEVICE参数，无报错）
      - name: 下载源码包（含工具链源码）
        run: |
          echo "PROJECT=${{ github.event.inputs.project }}"
          echo "ARCH=${{ github.event.inputs.arch }}"
          echo "DEVICE=${{ github.event.inputs.rockchip_device }}"
          PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool

      # 🔴 关键2：用GitHub Actions缓存替代Releases（无大小限制，后续编译可复用）
      - name: 缓存源码包（供后续编译使用）
        uses: actions/cache@v3
        with:
          # 缓存的目录：源码下载后的sources目录（核心）
          path: ./sources
          # 缓存key：用版本+项目+架构+设备命名，避免不同配置混淆
          key: librelec-sources-${{ github.event.inputs.librelec_version }}-${{ github.event.inputs.project }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.rockchip_device }}
          # 缓存失效策略：相同参数下，缓存不失效（除非手动删除缓存）
          restore-keys: |
            librelec-sources-${{ github.event.inputs.librelec_version }}-${{ github.event.inputs.project }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.rockchip_device }}

      # ✅ 新增：验证缓存（可选，调试用，确认缓存成功）
      - name: 验证源码缓存
        run: |
          echo "查看sources目录大小（确认下载成功）"
          du -sh ./sources  # 打印源码目录大小
          echo "缓存完成，后续编译可直接复用此源码，无需重复下载"
