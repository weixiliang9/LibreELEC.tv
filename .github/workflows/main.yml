name: RK3328 自动编译 - 适配 L1Pro (1296MHz)
on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存版本一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build
      DTS_MAIN: rk3328-l1pro-1296mhz.dts
      DTS_INCLUDE: rk3328.dtsi
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler

      - name: 切换版本
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}
          git status

      - name: 恢复源码缓存
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys:
            - ${{ env.CACHE_KEY }}
        id: cache-restore

      # 🔴 修复Line69报错：不用env变量传递，直接在命令中使用搜索结果
      - name: 自动搜索设备树目录
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "✅ 缓存命中"
            # 直接搜索，不存env变量（避免YAML解析混淆）
            OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
            if [ -n "$OFFICIAL_DTS_DIR" ]; then
              echo "✅ 找到设备树目录：$OFFICIAL_DTS_DIR"
              # 直接写入临时文件，后续步骤读取（避开env变量引用坑）
              echo "$OFFICIAL_DTS_DIR" > dts_dir.txt
              ls -l "$OFFICIAL_DTS_DIR"/rk3328*.dts
              ls -l "$OFFICIAL_DTS_DIR"/rk3328*.dtsi
            else
              echo "❌ 未找到设备树，重新下载源码"
              PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
              OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
              [ -z "$OFFICIAL_DTS_DIR" ] && exit 1
              echo "$OFFICIAL_DTS_DIR" > dts_dir.txt
            fi
          else
            echo "⚠️  缓存未命中，下载源码"
            PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
            OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
            echo "$OFFICIAL_DTS_DIR" > dts_dir.txt
            echo "✅ 源码下载完成，设备树目录：$OFFICIAL_DTS_DIR"
          fi

      # 🔴 修复Line148报错：读取临时文件，不用env变量，彻底避开YAML坑
      - name: 备份并替换设备树
        run: |
          # 读取设备树目录（从临时文件读取，不引用env变量）
          OFFICIAL_DTS_DIR=$(cat dts_dir.txt)
          mkdir -p backup/devicetree
          # 备份官方设备树（朴素写法，无复杂引号，YAML不误解）
          cp -r "$OFFICIAL_DTS_DIR"/rk3328*.dts backup/devicetree/
          cp -r "$OFFICIAL_DTS_DIR"/rk3328*.dtsi backup/devicetree/
          echo "✅ 备份官方设备树完成"
          # 替换自定义设备树（同样朴素写法）
          if [ -f "$DTS_MAIN" ] && [ -f "$DTS_INCLUDE" ]; then
            cp "$DTS_MAIN" "$OFFICIAL_DTS_DIR"/
            cp "$DTS_INCLUDE" "$OFFICIAL_DTS_DIR"/
            echo "✅ 替换设备树完成：$DTS_MAIN + $DTS_INCLUDE"
            ls -l "$OFFICIAL_DTS_DIR"/"$DTS_MAIN"
            ls -l "$OFFICIAL_DTS_DIR"/"$DTS_INCLUDE"
          else
            echo "❌ 未找到自定义设备树，请确认文件在仓库根目录"
            exit 1
          fi

      - name: 设备树语法校验
        run: |
          OFFICIAL_DTS_DIR=$(cat dts_dir.txt)
          dtc -I dts -O dtb -o /dev/null "$OFFICIAL_DTS_DIR"/"$DTS_MAIN"
          dtc -I dts -O dtb -o /dev/null "$OFFICIAL_DTS_DIR"/"$DTS_INCLUDE"
          echo "✅ 设备树语法校验通过"

      - name: 编译镜像
        run: |
          # 纯单行命令，无任何换行/复杂变量，YAML绝对解析正常
          PROJECT=${{ github.event.inputs.project }} DEVICE=${{ github.event.inputs.rockchip_device }} ARCH=${{ github.event.inputs.arch }} TMPDIR=$TEMP_DIR MAKEFLAGS="-j2" make image 2>&1 | tee build.log

      - name: 验证编译产物
        run: |
          echo "📁 查看编译产物"
          ls -l target/
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到镜像，查看build.log排查错误"
            exit 1
          fi

      - name: 上传镜像和日志
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-1296mhz-${{ github.event.inputs.librelec_version }}
          path:
            - target/*.img.gz
            - target/*.img
            - build.log
          retention-days: 30
          if-no-files-found: error

      - name: 上传设备树备份
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-backup
          path: backup/devicetree/
          retention-days: 7
