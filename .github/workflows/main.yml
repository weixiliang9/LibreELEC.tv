name: RK3328 自动编译 - 适配 L1Pro (1296MHz)

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存版本一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build  # 扩容临时目录，解决空间不足
      DTS_MAIN: rk3328-l1pro-1296mhz.dts  # 你的主设备树文件
      DTS_INCLUDE: rk3328.dtsi            # 你的设备树头文件
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328  # 你的缓存KEY
      # 🔴 固定适配LibreELEC 12.0 RK3328 6.6内核设备树路径（实测有效）
      OFFICIAL_DTS_DIR: ./sources/linux/linux-rockchip-6.6/arch/arm64/boot/dts/rockchip

    steps:
      - name: 拉取你Fork的LibreELEC仓库（含自定义设备树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖（基础+RK3328专用）
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip
          # RK3328交叉编译+设备树编译依赖
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler

      - name: 切换到指定版本（与缓存一致）
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}
          git status  # 调试：确认当前分支

      - name: 🔴 恢复源码缓存（关键！必须先恢复，设备树在sources目录中）
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
        id: cache-restore

      - name: 验证缓存并修复设备树目录（核心修复，适配6.6内核）
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！将复用已下载的源码和工具链"
            du -sh ./sources  # 查看缓存大小
            
            # 验证固定路径是否存在，若不存在则自动搜索（容错机制）
            if [ -d "${{ env.OFFICIAL_DTS_DIR }}" ] && [ -f "${{ env.OFFICIAL_DTS_DIR }}/rk3328.dtsi" ]; then
              echo "✅ 找到RK3328 6.6内核设备树目录：${{ env.OFFICIAL_DTS_DIR }}"
            else
              echo "⚠️  固定路径未找到，自动搜索设备树目录（适配6.6内核）"
              # 自动搜索6.6内核下的rk3328设备树（避免路径偏差）
              OFFICIAL_DTS_DIR=$(find ./sources -path "*/linux-rockchip-6.6/*/dts/rockchip" -name "rk3328.dtsi" -type f | xargs dirname | head -1)
              if [ -n "$OFFICIAL_DTS_DIR" ]; then
                echo "✅ 自动找到设备树目录：$OFFICIAL_DTS_DIR"
                # 更新环境变量，后续步骤复用
                echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
              else
                echo "❌ 未找到RK3328 6.6内核设备树！源码缓存不完整，重新下载"
                # 自动重新下载源码（确保获取6.6内核及设备树）
                PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
                # 重新验证路径
                OFFICIAL_DTS_DIR=$(find ./sources -path "*/linux-rockchip-6.6/*/dts/rockchip" -name "rk3328.dtsi" -type f | xargs dirname | head -1)
                [ -z "$OFFICIAL_DTS_DIR" ] && exit 1
                echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
              fi
            fi
          else
            echo "⚠️  缓存未命中！将重新下载源码（适配6.6内核）"
            # 自动下载源码（确保获取完整的6.6内核及设备树）
            PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
            
            # 验证设备树目录
            OFFICIAL_DTS_DIR=$(find ./sources -path "*/linux-rockchip-6.6/*/dts/rockchip" -name "rk3328.dtsi" -type f | xargs dirname | head -1)
            if [ -n "$OFFICIAL_DTS_DIR" ]; then
              echo "✅ 源码下载完成，找到6.6内核设备树目录：$OFFICIAL_DTS_DIR"
              echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
            else
              echo "❌ 源码下载完成但未找到RK3328 6.6内核设备树！"
              exit 1
            fi
          fi

      - name: 🔴 备份并替换官方设备树（核心步骤，适配6.6内核路径）
        run: |
          # 读取设备树目录（优先使用环境变量，兼容固定路径和自动搜索）
          OFFICIAL_DTS_DIR=${{ env.OFFICIAL_DTS_DIR }}
          
          # 备份官方RK3328设备树（只备份rk3328相关，不影响其他设备）
          mkdir -p backup/devicetree
          cp -r "$OFFICIAL_DTS_DIR"/rk3328*.dts backup/devicetree/
          cp -r "$OFFICIAL_DTS_DIR"/rk3328*.dtsi backup/devicetree/
          echo "✅ 已备份官方RK3328 6.6内核设备树到 backup/devicetree"

          # 复制你的自定义设备树到官方目录（覆盖，核心移植）
          if [ -f "${{ env.DTS_MAIN }}" ] && [ -f "${{ env.DTS_INCLUDE }}" ]; then
            cp "${{ env.DTS_MAIN }}" "$OFFICIAL_DTS_DIR"/
            cp "${{ env.DTS_INCLUDE }}" "$OFFICIAL_DTS_DIR"/
            echo "✅ 已替换设备树：${{ env.DTS_MAIN }} + ${{ env.DTS_INCLUDE }}"
            # 验证替换结果（调试用）
            ls -l "$OFFICIAL_DTS_DIR"/${{ env.DTS_MAIN }}
            ls -l "$OFFICIAL_DTS_DIR"/${{ env.DTS_INCLUDE }}
          else
            echo "❌ 未找到自定义设备树文件！请确认文件在仓库根目录"
            exit 1
          fi

      - name: 🔴 设备树语法预校验（提前规避编译报错）
        run: |
          OFFICIAL_DTS_DIR=${{ env.OFFICIAL_DTS_DIR }}
          # 校验自定义设备树语法（适配6.6内核dtc编译规则）
          dtc -I dts -O dtb -o /dev/null "$OFFICIAL_DTS_DIR"/${{ env.DTS_MAIN }}
          dtc -I dts -O dtb -o /dev/null "$OFFICIAL_DTS_DIR"/${{ env.DTS_INCLUDE }}
          echo "✅ 自定义设备树语法校验通过（适配6.6内核）"

      - name: 🔴 基础编译（RK3328 + L1Pro + 1296MHz，适配6.6内核）
        run: |
          # 单行编译命令（无YAML语法错误，适配6.6内核编译规则）
          PROJECT=${{ github.event.inputs.project }} DEVICE=${{ github.event.inputs.rockchip_device }} ARCH=${{ github.event.inputs.arch }} TMPDIR=${{ env.TEMP_DIR }} MAKEFLAGS="-j2" make image 2>&1 | tee build.log

      - name: 验证编译产物
        run: |
          echo "📁 编译产物目录（target）："
          ls -l target/
          # 查找镜像文件（.img.gz 或 .img）
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到编译镜像！查看 build.log 排查错误"
            exit 1
          fi

      - name: 上传编译镜像（供下载烧录，保存30天）
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-1296mhz-${{ github.event.inputs.librelec_version }}
          path: |
            target/*.img.gz
            target/*.img
            build.log  # 同时上传编译日志，方便调试
          retention-days: 30
          if-no-files-found: error

      - name: 上传设备树备份（可选，便于回滚）
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-backup
          path: backup/devicetree/
          retention-days: 7
