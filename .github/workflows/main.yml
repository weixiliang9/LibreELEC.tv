name: RK3328 自动编译 - 适配 L1Pro (1296MHz)

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存版本一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build  # 扩容临时目录，解决空间不足
      DTS_MAIN: rk3328-l1pro-1296mhz.dts  # 你的主设备树文件
      DTS_INCLUDE: rk3328.dtsi            # 你的设备树头文件
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328  # 你的缓存KEY

    steps:
      - name: 拉取你Fork的LibreELEC仓库（含自定义设备树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖（基础+RK3328专用）
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip
          # RK3328交叉编译+设备树编译依赖
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler

      - name: 切换到指定版本（与缓存一致）
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}
          git status  # 调试：确认当前分支

      - name: 🔴 备份并替换官方设备树（核心步骤）
        run: |
          # 备份官方RK3328设备树
          mkdir -p backup/devicetree
          cp -r projects/Rockchip/devices/RK3328/*.dts backup/devicetree/
          cp -r projects/Rockchip/devices/RK3328/*.dtsi backup/devicetree/
          echo "✅ 已备份官方设备树到 backup/devicetree"

          # 复制你的自定义设备树到官方目录（覆盖）
          if [ -f "${{ env.DTS_MAIN }}" ] && [ -f "${{ env.DTS_INCLUDE }}" ]; then
            cp ${{ env.DTS_MAIN }} projects/Rockchip/devices/RK3328/
            cp ${{ env.DTS_INCLUDE }} projects/Rockchip/devices/RK3328/
            echo "✅ 已替换设备树：${{ env.DTS_MAIN }} + ${{ env.DTS_INCLUDE }}"
            # 验证替换结果
            ls -l projects/Rockchip/devices/RK3328/*.dts
            ls -l projects/Rockchip/devices/RK3328/*.dtsi
          else
            echo "❌ 未找到自定义设备树文件！请确认文件在仓库根目录"
            exit 1
          fi

      - name: 🔴 恢复源码缓存（避免重复下载，节省空间和时间）
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
        id: cache-restore

      - name: 验证缓存是否恢复成功
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！将复用已下载的源码和工具链"
            du -sh ./sources  # 查看缓存大小
          else
            echo "⚠️  缓存未命中！将重新下载源码（可能耗时较长）"
            # 若缓存未命中，可手动触发之前的「下载源码」工作流先缓存
          fi

      - name: 🔴 基础编译（RK3328 + L1Pro + 1296MHz，优化空间和稳定性）
        run: |
          # 核心编译命令：指定项目、设备、架构、临时目录，限制线程避免溢出
          PROJECT=${{ github.event.inputs.project }} \
          DEVICE=${{ github.event.inputs.rockchip_device }} \
          ARCH=${{ github.event.inputs.arch }} \
          TMPDIR=${{ env.TEMP_DIR }} \
          MAKEFLAGS="-j2" \  # 限制2线程，平衡速度和稳定性（ubuntu-latest推荐）
          make image 2>&1 | tee build.log  # 保存编译日志，方便排查错误

      - name: 验证编译产物
        run: |
          echo "📁 编译产物目录（target）："
          ls -l target/
          # 查找镜像文件（.img.gz 或 .img）
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到编译镜像！查看 build.log 排查错误"
            exit 1
          fi

      - name: 上传编译镜像（供下载烧录，保存30天）
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-1296mhz-${{ github.event.inputs.librelec_version }}
          path: |
            target/*.img.gz
            target/*.img
            build.log  # 同时上传编译日志，方便调试
          retention-days: 30
          if-no-files-found: error

      - name: 上传设备树备份（可选，便于回滚）
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-backup
          path: backup/devicetree/
          retention-days: 7
