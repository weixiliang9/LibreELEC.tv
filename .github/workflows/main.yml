name: RK3328 自动编译 - 官方补丁版（适配L1Pro 1296MHz，最终无坑版）
on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build  # 扩容临时目录（编译需≥20GB）
      DTS_MAIN: rk3328-l1pro-1296mhz.dts  # 自定义主设备树
      DTS_INCLUDE: rk3328.dtsi            # 设备树头文件
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328  # 缓存KEY
      LINUX_SRC_DIR: ./sources/linux/linux-rockchip  # 内核源码目录
      OFFICIAL_DTS_DIR: ./sources/linux/linux-rockchip/arch/arm64/boot/dts/rockchip  # 设备树目录
      PATCH_DIR: projects/Rockchip/patches/linux  # 官方补丁目录
      LINUX_TAR: ./sources/linux/linux-6.6.71.tar.xz  # 内核压缩包

    steps:
      - name: 拉取Fork的LibreELEC仓库（含自定义设备树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔴 修复后的前置清理（核心：忽略未安装包，不报错，仍释放30+GB）
      - name: 前置清理-释放系统空间（编译前必做，修复报错）
        run: |
          echo "📊 清理前磁盘占用："
          df -h
          # 关键优化：--ignore-missing 忽略未安装的包，不报错；只删除真正可能预装的大体积包
          sudo apt-get remove -y --purge --ignore-missing dotnet-* mono-* android-*
          sudo apt-get autoremove -y --ignore-missing
          sudo apt-get clean
          # 2. 清理系统缓存和临时文件（不变，核心释放空间）
          sudo rm -rf /var/cache/apt/* /var/log/* /tmp/*
          sudo rm -rf /home/runner/.nuget /home/runner/.cache /home/runner/.local
          # 3. 清理Runner日志缓存（对应你之前的报错，不变）
          sudo rm -rf /home/runner/actions-runner/_diag/*
          # 4. 清理工具缓存目录（超大，释放10+GB，不变）
          sudo rm -rf /opt/hostedtoolcache/*
          echo "📊 清理后磁盘占用："
          df -h

      - name: 安装官方完整编译依赖（补全+验证，核心修复）
        run: |
          sudo apt update
          # 1. 基础编译依赖（保留）
          sudo apt install -y bc curl git rsync unzip xz-utils zip diffutils
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler
          # 2. 补全报错缺失依赖（一一对应官方清单，重点优化xsltproc）
          sudo apt install -y xfonts-utils
          sudo apt install -y rdfind
          sudo apt install -y libparse-yapp-perl
          sudo apt install -y gperf
          sudo apt install -y libxslt1.1 xsltproc  # 🔧 重点：显式安装xsltproc（即使重复，确保识别）
          sudo apt install -y libxml-parser-perl
          sudo apt install -y patchutils
          sudo apt install -y lzop

          # 3. 🔧 新增：验证所有关键工具是否存在（避免官方checkdeps检测失败）
          echo "✅ 验证依赖工具是否可用"
          which mkfontdir || (echo "❌ mkfontdir缺失" && exit 1)
          which mkfontscale || (echo "❌ mkfontscale缺失" && exit 1)
          which rdfind || (echo "❌ rdfind缺失" && exit 1)
          which gperf || (echo "❌ gperf缺失" && exit 1)
          which xsltproc || (echo "❌ xsltproc缺失，重新安装" && sudo apt install -y --reinstall libxslt1.1 xsltproc && exit 1)
          which lsdiff || (echo "❌ lsdiff缺失" && exit 1)
          which lzop || (echo "❌ lzop缺失" && exit 1)
          echo "✅ 所有官方编译依赖安装+验证完成"

      - name: 切换到指定版本（与缓存一致）
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}
          git status

      - name: 🔴 恢复源码缓存（优先复用，缺失则补全）
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
        id: cache-restore

      - name: 🔴 打印源码压缩包情况（确认压缩包存在）
        run: |
          echo "📁 查看sources/linux目录（确认内核压缩包）"
          ls -l ./sources/linux/
          echo "📁 源码总大小：$(du -sh ./sources | cut -f1)"

      - name: 🔴 强制补全RK3328专属源码（确保压缩包完整）
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！校验内核压缩包"
            if [ ! -f "${{ env.LINUX_TAR }}" ]; then
              echo "⚠️  缓存缺失压缩包，重新下载"
              PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
            fi
          else
            echo "⚠️  缓存未命中，下载RK3328专属源码"
            PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
          fi

      - name: 🔴 解压内核压缩包（官方标准流程）
        run: |
          echo "🔧 解压内核压缩包：${{ env.LINUX_TAR }}"
          [ -d "${{ env.LINUX_SRC_DIR }}" ] && rm -rf "${{ env.LINUX_SRC_DIR }}"
          mkdir -p "${{ env.LINUX_SRC_DIR }}"
          tar -xf "${{ env.LINUX_TAR }}" -C "${{ env.LINUX_SRC_DIR }}" --strip-components=1
          echo "✅ 解压完成！"

      # 🔴 新增2：解压后清理（释放内核压缩包占用，避免冗余）
      - name: 解压后清理-删除内核压缩包
        run: |
          echo "🔧 删除已解压的内核压缩包（释放空间）"
          if [ -f "${{ env.LINUX_TAR }}" ]; then
            rm -rf "${{ env.LINUX_TAR }}"
            echo "✅ 内核压缩包删除完成"
          fi
          # 清理源码目录下的临时解压文件
          rm -rf ./sources/*/*.tar.xz ./sources/*/*.zip 2>/dev/null

      - name: 🔴 核心一步：打印所有RK3328设备树文件（确认真实文件）
        run: |
          echo "📋 解压后，RK3328所有设备树文件（真实存在）："
          ls -l "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dts
          ls -l "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dtsi
          # 动态获取官方主设备树
          OFFICIAL_MAIN_DTS=$(ls "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dts | head -1)
          OFFICIAL_MAIN_DTSI=$(ls "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dtsi | head -1)
          echo "✅ 自动获取官方主设备树：$OFFICIAL_MAIN_DTS"
          echo "✅ 自动获取官方设备树头文件：$OFFICIAL_MAIN_DTSI"
          echo "OFFICIAL_MAIN_DTS=$OFFICIAL_MAIN_DTS" >> $GITHUB_ENV
          echo "OFFICIAL_MAIN_DTSI=$OFFICIAL_MAIN_DTSI" >> $GITHUB_ENV

      - name: 🔴 最终校验设备树（确保文件真实存在）
        run: |
          if [ -z "${{ env.OFFICIAL_MAIN_DTS }}" ] || [ -z "${{ env.OFFICIAL_MAIN_DTSI }}" ]; then
            echo "❌ 未找到RK3328设备树文件！"
            exit 1
          fi
          echo "✅ 设备树校验通过，开始生成补丁"

      - name: 🔴 备份官方设备树（用真实文件名，无硬写）
        run: |
          mkdir -p backup/devicetree
          cp -r "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dts backup/devicetree/
          cp -r "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dtsi backup/devicetree/
          echo "✅ 备份官方RK3328所有设备树完成"

      - name: 🔴 生成官方标准补丁（无Git报错，已验证）
        run: |
          # 校验自定义设备树是否存在
          if [ ! -f "${{ env.DTS_MAIN }}" ] || [ ! -f "${{ env.DTS_INCLUDE }}" ]; then
            echo "❌ 未找到自定义设备树！"
            exit 1
          fi

          mkdir -p tmp-patch
          # 复制官方设备树到临时目录
          cp "${{ env.OFFICIAL_MAIN_DTS }}" tmp-patch/
          cp "${{ env.OFFICIAL_MAIN_DTSI }}" tmp-patch/
          # 替换为自定义设备树
          cp "${{ env.DTS_MAIN }}" "${{ env.OFFICIAL_MAIN_DTS }}"
          cp "${{ env.DTS_INCLUDE }}" "${{ env.OFFICIAL_MAIN_DTSI }}"

          # 生成官方兼容补丁
          cd tmp-patch
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "RK3328: Update device tree for L1Pro 1296MHz"
          git format-patch --root -o ../${{ env.PATCH_DIR }}
          cd ..
          rm -rf tmp-patch

          # 验证补丁是否生成成功
          PATCH_FILE=$(ls ${{ env.PATCH_DIR }}/*.patch | head -1)
          if [ -n "$PATCH_FILE" ]; then
            echo "✅ 生成官方兼容补丁完成：$PATCH_FILE"
            cat "$PATCH_FILE" | head -5
          else
            echo "❌ 补丁生成失败！"
            exit 1
          fi

      - name: 🔴 清理旧编译产物（已修复DEVICE空值报错）
        run: |
          PROJECT=${{ github.event.inputs.project }} DEVICE=RK3328 ARCH=${{ github.event.inputs.arch }} scripts/clean linux
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

      - name: 🔴 官方标准编译（无自定义参数，不踩坑）
        run: |
          PROJECT=${{ github.event.inputs.project }} DEVICE=RK3328 ARCH=${{ github.event.inputs.arch }} TMPDIR=${{ env.TEMP_DIR }} MAKEFLAGS="-j2" make image 2>&1 | tee build.log

      - name: 验证编译产物
        run: |
          echo "📁 查看编译产物目录："
          ls -l target/
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到镜像，查看build.log排查"
            exit 1
          fi

      - name: 上传产物（便于调试，保留所有关键文件）
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-${{ github.event.inputs.librelec_version }}
          path: |
            target/*.img.gz
            target/*.img
            build.log
            ${{ env.PATCH_DIR }}/*.patch
            backup/devicetree/
          retention-days: 30
          if-no-files-found: error

      # 🔴 新增3：编译后即时清理（释放中间文件，避免日志/临时文件堆积）
      - name: 编译后清理-释放编译空间
        run: |
          echo "🔧 编译完成，清理中间产物和临时文件"
          # 1. 清理编译中间目录
          rm -rf build.* target/*/.cache target/*/tmp 2>/dev/null
          # 2. 清理临时编译目录
          rm -rf "${{ env.TEMP_DIR }}"
          # 3. 清理备份和补丁目录（产物已上传，无需保留）
          rm -rf backup tmp-patch ${{ env.PATCH_DIR }} 2>/dev/null
          # 4. 清理Git临时文件
          git clean -fdx
          echo "📊 清理后最终磁盘占用："
          df -h

      # 🔴 新增4：终极兜底清理（防止日志占满，适配你之前的报错）
      - name: 兜底清理-Runner日志和缓存（避免下次编译报错）
        if: always()  # 无论编译成功/失败，都执行
        run: |
          sudo rm -rf /home/runner/actions-runner/_diag/*
          sudo rm -rf /tmp/* /var/tmp/*
          echo "✅ 兜底清理完成，避免下次编译磁盘不足"
