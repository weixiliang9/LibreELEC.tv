name: RK3328 自动编译 - 适配 L1Pro (1296MHz)

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build  # 扩容临时目录，解决空间不足
      DTS_MAIN: rk3328-l1pro-1296mhz.dts  # 你的主设备树文件
      DTS_INCLUDE: rk3328.dtsi        # 你的设备树头文件
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328  # 缓存KEY
      # 🔴 官方标准设备树路径（适配6.6内核）
      OFFICIAL_DTS_DIR: ./sources/linux/linux-rockchip-6.6/arch/arm64/boot/dts/rockchip
      # 🔴 官方推荐补丁目录（非直接替换）
      PATCH_DIR: projects/Rockchip/patches/linux

    steps:
      - name: 拉取Fork的LibreELEC仓库（含自定义设备树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖（基础+RK3328专用）
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip
          # RK3328交叉编译+设备树编译依赖
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler

      - name: 切换到指定版本（与缓存一致）
        run: |
          git checkout ${{ github.event.inputs.libreelec_version }}
          git status  # 调试：确认当前分支

      - name: 🔴 恢复源码缓存（必须先恢复，设备树在sources目录中）
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
        id: cache-restore

      - name: 验证缓存并确认设备树路径（官方标准）
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！将复用已下载的源码和工具链"
            du -sh ./sources  # 查看缓存大小
            
            # 验证官方设备树路径是否存在
            if [ -d "${{ env.OFFICIAL_DTS_DIR }}" ] && [ -f "${{ env.OFFICIAL_DTS_DIR }}/rk3328.dtsi" ]; then
              echo "✅ 找到官方RK3328设备树目录：${{ env.OFFICIAL_DTS_DIR }}"
            else
              echo "❌ 未找到官方设备树！请先触发「下载源码」工作流缓存完整源码"
              exit 1
            fi
          else
            echo "⚠️  缓存未命中！将重新下载源码（含完整设备树）"
            # 自动下载源码（确保获取完整6.6内核及设备树）
            PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
            
            # 验证下载后的设备树路径
            if [ ! -d "${{ env.OFFICIAL_DTS_DIR }}" ] || [ ! -f "${{ env.OFFICIAL_DTS_DIR }}/rk3328.dtsi" ]; then
              echo "❌ 源码下载完成但未找到RK3328设备树！"
              exit 1
            fi
          fi

      - name: 🔴 创建设备树补丁（官方推荐方式，非直接替换）
        run: |
          # 1. 备份原始设备树（官方标准流程）
          mkdir -p backup/devicetree
          cp -r "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dts backup/devicetree/
          cp -r "${{ env.OFFICIAL_DTS_DIR }}"/rk3328*.dtsi backup/devicetree/
          echo "✅ 已备份官方设备树到 backup/devicetree"

          # 2. 生成补丁文件（核心改进：使用官方补丁机制）
          # 确保自定义设备树文件存在
          if [ ! -f "${{ env.DTS_MAIN }}" ] || [ ! -f "${{ env.DTS_INCLUDE }}" ]; then
            echo "❌ 未找到自定义设备树文件！请确认文件在仓库根目录"
            exit 1
          fi

          # 3. 创建临时目录存放补丁
          mkdir -p tmp-patch
          
          # 4. 将官方设备树复制到临时目录（用于生成diff）
          cp "${{ env.OFFICIAL_DTS_DIR }}"/rk3328.dts tmp-patch/
          cp "${{ env.OFFICIAL_DTS_DIR }}"/rk3328.dtsi tmp-patch/
          
          # 5. 替换为自定义设备树并生成补丁
          cp "${{ env.DTS_MAIN }}" tmp-patch/rk3328.dts
          cp "${{ env.DTS_INCLUDE }}" tmp-patch/rk3328.dtsi
          
          # 6. 生成标准格式补丁（含完整头部信息）
          cd tmp-patch
          git init
          git add .
          git commit -m "Update RK3328 device tree for L1Pro 1296MHz"
          # 生成带编号的标准补丁（官方推荐格式）
          git format-patch -o ../${{ env.PATCH_DIR }} HEAD^
          cd ..
          rm -rf tmp-patch
          
          echo "✅ 已生成设备树补丁：${{ env.PATCH_DIR }}/0001-Update-RK3328-device-tree-for-L1Pro-1296MHz.patch"

      - name: 🔴 清除旧编译产物（确保使用新补丁）
        run: |
          # 清除旧的linux编译产物（确保应用补丁）
          PROJECT=${{ github.event.inputs.project }} DEVICE=${{ github.event.inputs.rockchip_device }} ARCH=${{ github.event.inputs.arch }} scripts/clean linux
          # 清除临时目录
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

      - name: 🔴 基础编译（RK3328 + L1Pro + 1296MHz，适配6.6内核）
        run: |
          # 单行编译命令（无YAML语法错误，适配6.6内核）
          PROJECT=${{ github.event.inputs.project }} DEVICE=${{ github.event.inputs.rockchip_device }} ARCH=${{ github.event.inputs.arch }} TMPDIR=${{ env.TEMP_DIR }} MAKEFLAGS="-j2" make image 2>&1 | tee build.log

      - name: 验证编译产物
        run: |
          echo "📁 编译产物目录（target）："
          ls -l target/
          # 查找镜像文件（.img.gz 或 .img）
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到编译镜像！查看 build.log 排查错误"
            exit 1
          fi

      - name: 上传编译镜像（保存30天）
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-1296mhz-${{ github.event.inputs.libreelec_version }}
          path: |
            target/*.img.gz
            target/*.img
            build.log  # 同时上传编译日志，方便调试
          retention-days: 30
          if-no-files-found: error

      - name: 上传设备树备份和补丁（便于回滚和分享）
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-patch-backup
          path: |
            backup/devicetree/
            ${{ env.PATCH_DIR }}/*.patch
          retention-days: 7
