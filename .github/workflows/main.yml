name: RK3328 自动编译 - 适配 L1Pro (1296MHz)

on:
  workflow_dispatch:
    inputs:
      librelec_version:
        type: choice
        description: 选择LibreELEC分支/版本（必须与缓存版本一致）
        required: true
        options:
          - master（开发分支）
          - 12.0.2（稳定版）
          - 11.0.1（稳定版）
          - libreelec-12.0
        default: libreelec-12.0
      project:
        type: choice
        description: 构建项目（固定为Rockchip）
        required: true
        options:
          - Rockchip
        default: Rockchip
      arch:
        type: choice
        description: 目标架构（RK3328固定为aarch64）
        required: true
        options:
          - aarch64
        default: aarch64
      rockchip_device:
        type: choice
        description: 目标设备（固定为RK3328）
        required: true
        options:
          - RK3328
        default: RK3328

jobs:
  build-rk3328-image:
    runs-on: ubuntu-latest
    env:
      TEMP_DIR: /tmp/libreelec-build
      DTS_MAIN: rk3328-l1pro-1296mhz.dts
      DTS_INCLUDE: rk3328.dtsi
      CACHE_KEY: librelec-sources-libreelec-12.0-Rockchip-aarch64-RK3328

    steps:
      - name: 拉取你Fork的LibreELEC仓库（编译脚本+自定义设备树）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖（基础+RK3328专用）
        run: |
          sudo apt update
          sudo apt install -y bc curl git rsync unzip xz-utils zip
          sudo apt install -y gcc-aarch64-linux-gnu make meson ninja-build patch device-tree-compiler

      - name: 切换到指定版本（与缓存一致）
        run: |
          git checkout ${{ github.event.inputs.librelec_version }}
          git status

      - name: 🔴 恢复源码缓存（关键！先拿到所有源码和设备树）
        uses: actions/cache@v3
        with:
          path: ./sources
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
        id: cache-restore

      - name: 🔴 自动搜索RK3328设备树目录（终极解决方案）
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！复用已下载的源码和设备树（大小：$(du -sh ./sources | cut -f1)）"
            OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
            if [ -n "$OFFICIAL_DTS_DIR" ]; then
              echo "✅ 自动找到RK3328设备树目录：$OFFICIAL_DTS_DIR"
              echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
              ls -l $OFFICIAL_DTS_DIR/rk3328*.dts
              ls -l $OFFICIAL_DTS_DIR/rk3328*.dtsi
            else
              echo "❌ 未找到RK3328设备树！重新下载源码"
              PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
              OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
              if [ -z "$OFFICIAL_DTS_DIR" ]; then exit 1; fi
              echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
            fi
          else
            echo "⚠️  缓存未命中！自动下载源码"
            PROJECT=${{ github.event.inputs.project }} ARCH=${{ github.event.inputs.arch }} DEVICE=${{ github.event.inputs.rockchip_device }} tools/download-tool
            OFFICIAL_DTS_DIR=$(find ./sources -name "rk3328.dtsi" -type f | xargs dirname | head -1)
            echo "OFFICIAL_DTS_DIR=$OFFICIAL_DTS_DIR" >> $GITHUB_ENV
            echo "✅ 源码下载完成，设备树目录：$OFFICIAL_DTS_DIR"
          fi

      - name: 🔴 备份并替换设备树（核心移植步骤）
        run: |
          OFFICIAL_DTS_DIR=${{ env.OFFICIAL_DTS_DIR }}
          mkdir -p backup/devicetree
          cp -r $OFFICIAL_DTS_DIR/rk3328*.dts backup/devicetree/
          cp -r $OFFICIAL_DTS_DIR/rk3328*.dtsi backup/devicetree/
          echo "✅ 已备份官方RK3328设备树"
          if [ -f "${{ env.DTS_MAIN }}" ] && [ -f "${{ env.DTS_INCLUDE }}" ]; then
            cp ${{ env.DTS_MAIN }} $OFFICIAL_DTS_DIR/
            cp ${{ env.DTS_INCLUDE }} $OFFICIAL_DTS_DIR/
            echo "✅ 已替换设备树：${{ env.DTS_MAIN }} + ${{ env.DTS_INCLUDE }}"
            ls -l $OFFICIAL_DTS_DIR/${{ env.DTS_MAIN }}
            ls -l $OFFICIAL_DTS_DIR/${{ env.DTS_INCLUDE }}
          else
            echo "❌ 未找到自定义设备树文件！请确认文件在仓库根目录"
            exit 1
          fi

      - name: 🔴 设备树语法预校验（提前规避编译报错）
        run: |
          OFFICIAL_DTS_DIR=${{ env.OFFICIAL_DTS_DIR }}
          dtc -I dts -O dtb -o /dev/null $OFFICIAL_DTS_DIR/${{ env.DTS_MAIN }}
          dtc -I dts -O dtb -o /dev/null $OFFICIAL_DTS_DIR/${{ env.DTS_INCLUDE }}
          echo "✅ 自定义设备树语法校验通过"

      # 🔴 语法修正核心（第179行附近，之前报错位置）
      - name: 🔴 基础编译（RK3328 + L1Pro + 1296MHz）
        run: PROJECT=${{ github.event.inputs.project }} DEVICE=${{ github.event.inputs.rockchip_device }} ARCH=${{ github.event.inputs.arch }} TMPDIR=${{ env.TEMP_DIR }} MAKEFLAGS="-j2" make image 2>&1 | tee build.log

      - name: 验证编译产物
        run: |
          echo "📁 编译产物目录（target）："
          ls -l target/
          IMAGE_FILE=$(find target -name "*.img.gz" -o -name "*.img" | head -1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "✅ 编译成功！镜像路径：$IMAGE_FILE"
            du -sh "$IMAGE_FILE"
          else
            echo "❌ 未找到编译镜像！查看 build.log 排查错误"
            exit 1
          fi

      - name: 上传编译镜像（供下载烧录，保存30天）
        uses: actions/upload-artifact@v4
        with:
          name: librelec-rk3328-l1pro-1296mhz-${{ github.event.inputs.librelec_version }}
          path:
            - target/*.img.gz
            - target/*.img
            - build.log
          retention-days: 30
          if-no-files-found: error

      - name: 上传设备树备份（可选，便于回滚）
        uses: actions/upload-artifact@v4
        with:
          name: devicetree-backup
          path: backup/devicetree/
          retention-days: 7
          
